<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Småkunst — plakater der inviterer til samtale</title>
<meta name="description" content="Småkunst er en lille webshop med farverige, illustrerede plakater til hjem og institutioner. Tegnet med kærlighed af Sofie. Trykt on demand på FSC/PEFC-certificeret papir.">

<!-- ===== SEO / social ===== -->
<meta property="og:title" content="Småkunst — illustrerede plakater">
<meta property="og:description" content="Farverige plakater til hjem og institutioner. Trykt on demand, med omtanke.">
<meta property="og:type" content="website">
<meta property="og:locale" content="da_DK">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --cream:      #FBF6EC;
    --cream-deep: #F4EAD7;
    --ink:        #3D3A33;
    --ink-soft:   #6B655B;
    --coral:      #E8775A;
    --coral-deep: #D85F43;
    --leaf:       #7C9A6E;
    --sky:        #8FB8C9;
    --line:       #E5D9C4;
    --radius:     18px;
    --shadow:     0 8px 30px rgba(61, 58, 51, 0.08);
    --shadow-lift:0 16px 44px rgba(61, 58, 51, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(232,119,90,0.06), transparent 42%),
      radial-gradient(circle at 88% 8%, rgba(143,184,201,0.07), transparent 40%);
    min-height: 100vh;
  }

  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; line-height: 1.15; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header.site {
    position: sticky; top: 0; z-index: 50;
    background: rgba(251, 246, 236, 0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .site-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; max-width: 1120px; margin: 0 auto;
  }
  .logo { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 600;
          letter-spacing: -0.5px; display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .logo .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--coral); display: inline-block; }
  .cart-link {
    display: inline-flex; align-items: center; gap: 8px; background: var(--coral); color: #fff;
    padding: 10px 18px; border-radius: 100px; font-weight: 700; font-size: 0.92rem;
    transition: transform .15s ease, background .15s ease; border: none; cursor: pointer;
    font-family: inherit;
  }
  .cart-link:hover { background: var(--coral-deep); transform: translateY(-1px); }
  .cart-link .badge {
    background: #fff; color: var(--coral-deep); border-radius: 100px; min-width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.78rem; padding: 0 6px;
  }

  /* Hero */
  .hero { padding: 70px 0 40px; text-align: center; }
  .hero h1 { font-size: clamp(2.4rem, 5vw, 3.6rem); margin-bottom: 18px; }
  .hero h1 em { font-style: italic; color: var(--coral); }
  .hero p { max-width: 540px; margin: 0 auto; color: var(--ink-soft); font-size: 1.1rem; }
  .hero .tag { display: inline-block; font-size: 0.82rem; font-weight: 700; letter-spacing: 1.5px;
               text-transform: uppercase; color: var(--leaf); margin-bottom: 18px; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 30px; padding: 30px 0 90px; }
  .card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
          transition: transform .2s ease, box-shadow .2s ease; display: flex; flex-direction: column;
          cursor: pointer; text-align: left; border: none; font-family: inherit; padding: 0; }
  .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lift); }
  .card .thumb { aspect-ratio: 4/5; background: var(--cream-deep); display: flex; align-items: center;
                 justify-content: center; overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .thumb .ph { color: var(--ink-soft); font-size: 0.85rem; }
  .card .body { padding: 20px 22px 24px; flex: 1; display: flex; flex-direction: column; }
  .card .body h3 { font-size: 1.25rem; margin-bottom: 6px; color: var(--ink); }
  .card .body .price { color: var(--coral-deep); font-weight: 700; margin-top: auto; }
  .card .body .price small { color: var(--ink-soft); font-weight: 600; }

  /* Detail */
  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; padding: 16px 0 90px; align-items: start; }
  .detail .imgcol { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
                    aspect-ratio: 4/5; display: flex; align-items: center; justify-content: center; }
  .detail .imgcol img { width: 100%; height: 100%; object-fit: cover; }
  .detail .imgcol .ph { color: var(--ink-soft); }
  .detail h1 { font-size: 2.4rem; margin-bottom: 16px; }
  .detail .desc { color: var(--ink-soft); font-size: 1.08rem; margin-bottom: 28px; white-space: pre-line; }
  .detail .price-now { font-size: 1.6rem; color: var(--coral-deep); font-weight: 700; margin-bottom: 22px; }

  .sizes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; }
  .size-opt { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 16px;
              cursor: pointer; transition: all .15s ease; font-family: inherit; font-size: 0.95rem;
              color: var(--ink); display: flex; flex-direction: column; gap: 2px; min-width: 100px; text-align: left; }
  .size-opt:hover { border-color: var(--coral); }
  .size-opt.active { border-color: var(--coral); background: #FDEFE9; }
  .size-opt .s-size { font-weight: 700; }
  .size-opt .s-price { font-size: 0.85rem; color: var(--ink-soft); }

  .btn { background: var(--coral); color: #fff; border: none; cursor: pointer; font-family: 'Nunito Sans', sans-serif;
         font-weight: 700; font-size: 1rem; padding: 15px 30px; border-radius: 100px;
         transition: background .15s ease, transform .15s ease; }
  .btn:hover { background: var(--coral-deep); transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.full { width: 100%; }
  .btn.ghost { background: transparent; color: var(--coral-deep); border: 1.5px solid var(--coral); }
  .btn.ghost:hover { background: #FDEFE9; }

  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); font-weight: 600;
          margin: 24px 0 8px; font-size: 0.95rem; cursor: pointer; background: none; border: none; font-family: inherit; }
  .back:hover { color: var(--coral-deep); }

  .note-eco { margin-top: 24px; padding: 16px 18px; background: #fff; border-radius: 14px; border: 1px solid var(--line);
              color: var(--ink-soft); font-size: 0.92rem; display: flex; gap: 10px; align-items: flex-start; }
  .note-eco .leaf { color: var(--leaf); font-size: 1.1rem; }

  /* Panels / cart */
  .panel { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 32px; margin: 20px 0 90px; }
  .panel h1 { font-size: 2rem; margin-bottom: 24px; }
  .cart-row { display: flex; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .cart-row:last-of-type { border-bottom: none; }
  .cart-row .ci-img { width: 72px; height: 90px; border-radius: 10px; object-fit: cover; background: var(--cream-deep); flex-shrink: 0; }
  .cart-row .ci-info { flex: 1; }
  .cart-row .ci-info h3 { font-size: 1.15rem; }
  .cart-row .ci-info .ci-size { color: var(--ink-soft); font-size: 0.9rem; }
  .cart-row .ci-price { font-weight: 700; color: var(--coral-deep); white-space: nowrap; }
  .qty { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; }
  .qty input { width: 54px; padding: 7px; text-align: center; border: 1.5px solid var(--line); border-radius: 8px;
               font-family: inherit; font-size: 0.95rem; }
  .remove { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 0.85rem;
            text-decoration: underline; margin-top: 8px; font-family: inherit; }
  .remove:hover { color: var(--coral-deep); }
  .cart-total { display: flex; justify-content: space-between; align-items: center; margin-top: 24px;
                padding-top: 20px; border-top: 2px solid var(--line); }
  .cart-total .lbl { font-family: 'Fraunces', serif; font-size: 1.4rem; }
  .cart-total .amt { font-size: 1.5rem; font-weight: 700; color: var(--coral-deep); }

  .empty { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .empty h2 { font-size: 1.6rem; margin-bottom: 12px; color: var(--ink); }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; }
  .field input, .field textarea { width: 100%; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px;
                                   font-family: inherit; font-size: 1rem; background: var(--cream); color: var(--ink); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--coral); background: #fff; }
  .field textarea { min-height: 90px; resize: vertical; }

  .errors { background: #FDEFE9; border: 1px solid var(--coral); border-radius: 12px; padding: 14px 18px;
            margin-bottom: 20px; color: var(--coral-deep); }
  .errors ul { margin-left: 18px; }

  .layout-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: start; }

  footer.site { border-top: 1px solid var(--line); padding: 40px 0; color: var(--ink-soft); font-size: 0.9rem; }
  .foot-inner { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; }

  /* Loading + states */
  .loading, .data-warn { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--cream-deep); border-top-color: var(--coral);
             border-radius: 50%; margin: 0 auto 16px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .data-warn { background: #FDEFE9; border: 1px solid var(--coral); border-radius: 14px; color: var(--coral-deep);
               max-width: 560px; margin: 40px auto; }

  .reveal { animation: rise .5s ease backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {
    .detail, .layout-2 { grid-template-columns: 1fr; gap: 30px; }
    .hero { padding: 46px 0 24px; }
    .cart-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <div class="logo" onclick="go('shop')"><span class="dot"></span>Småkunst</div>
    <button class="cart-link" onclick="go('cart')">
      Kurv <span class="badge" id="cartBadge" style="display:none;">0</span>
    </button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>Henter plakater…</div>
</main>

<footer class="site">
  <div class="wrap foot-inner">
    <div>Småkunst · plakater af Sofie · trykt on demand på certificeret papir</div>
    <div>Skrevet og tegnet med kærlighed i Danmark</div>
  </div>
</footer>

<script>
/* ============================================================================
   Småkunst — statisk webshop
   Læser produkter fra et offentligt Google Sheet, holder kurv i localStorage,
   og samler bestillingen via en mailto-besked til Sofie.
   Stripe kan kobles på senere — se kommentaren ved checkout().
============================================================================ */

/* ---------- Konfiguration ------------------------------------------------- */
const CONFIG = {
  sheetId:    '1xRqlwRXiyKWymnxP4s28IGXDTa-2-E-LlOW9wGtlaI8',
  apiKey:     'AIzaSyArsm9StOFP-nEvR27RAmPD7NjS7WWETxk',          // <- indsæt din Google Sheets API-nøgle
  ownerEmail: 'nikolaj@smaakunst.dk',         // <- din mailadresse
  currency:   'kr.',
};

/* ---------- Hjælpere ------------------------------------------------------ */
const kr = n => new Intl.NumberFormat('da-DK').format(Math.round(n)) + ' ' + CONFIG.currency;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const app = document.getElementById('app');

/* ---------- Kurv (localStorage) ------------------------------------------ */
function getCart() {
  try { return JSON.parse(localStorage.getItem('smaakunst_cart')) || {}; }
  catch { return {}; }
}
function saveCart(c) { localStorage.setItem('smaakunst_cart', JSON.stringify(c)); updateBadge(); }
function cartCount() { return Object.values(getCart()).reduce((n, l) => n + l.qty, 0); }
function cartTotal() { return Object.values(getCart()).reduce((t, l) => t + l.price * l.qty, 0); }
function updateBadge() {
  const b = document.getElementById('cartBadge'), n = cartCount();
  b.textContent = n; b.style.display = n > 0 ? 'inline-flex' : 'none';
}

function addToCart(pid, size) {
  const p = CATALOG[pid]; if (!p) return;
  const v = p.variants.find(v => v.size === size); if (!v) return;
  const cart = getCart(), key = pid + '|' + size;
  if (cart[key]) cart[key].qty++;
  else cart[key] = { product_id: pid, name: p.name, size, price: v.price, image_url: v.image_url || '', qty: 1 };
  saveCart(cart); go('cart');
}
function setQty(key, qty) {
  const cart = getCart(); qty = Math.max(0, parseInt(qty) || 0);
  if (qty === 0) delete cart[key]; else cart[key].qty = qty;
  saveCart(cart); renderCart();
}
function removeLine(key) { const c = getCart(); delete c[key]; saveCart(c); renderCart(); }

/* ---------- Datahentning -------------------------------------------------- */
let CATALOG = {};

async function fetchTab(tab) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.sheetId}/values/${tab}?key=${CONFIG.apiKey}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheet ' + tab + ' svarede ' + res.status);
  const data = await res.json();
  const rows = data.values || [];
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => String(h).trim());
  return rows.slice(1).map(r => {
    const o = {}; headers.forEach((h, i) => o[h] = (r[i] ?? '').toString().trim()); return o;
  });
}

async function loadCatalog() {
  const [products, variants] = await Promise.all([fetchTab('Products'), fetchTab('Variants')]);

  const byProduct = {};
  variants.forEach(v => {
    if (!v.product_id) return;
    v.price = parseFloat(String(v.price).replace(',', '.')) || 0;
    (byProduct[v.product_id] ||= []).push(v);
  });

  const catalog = {};
  products.forEach(p => {
    if (String(p.available).toUpperCase() !== 'TRUE') return;
    const vs = byProduct[p.id]; if (!vs || !vs.length) return;
    vs.sort((a, b) => a.price - b.price);
    catalog[p.id] = {
      id: p.id, name: p.name || 'Plakat', description: p.description || '',
      variants: vs, min_price: vs[0].price, thumb: vs[0].image_url || '',
    };
  });
  return catalog;
}

/* ---------- Visninger ----------------------------------------------------- */
function go(view, arg) {
  location.hash = view + (arg ? '/' + arg : '');
}

function router() {
  const [view, arg] = location.hash.replace(/^#/, '').split('/');
  window.scrollTo(0, 0);
  switch (view) {
    case 'product':  renderProduct(arg); break;
    case 'cart':     renderCart(); break;
    case 'checkout': renderCheckout(); break;
    case 'done':     renderDone(); break;
    default:         renderShop();
  }
}

function renderShop() {
  const items = Object.values(CATALOG);
  if (!items.length) { renderEmptyData(); return; }
  app.innerHTML = `
    <section class="hero reveal">
      <span class="tag">Illustrerede plakater · trykt on demand</span>
      <h1>Farver, der <em>inviterer</em> til samtale</h1>
      <p>Små kunstværker til hjem og institutioner — tegnet med omtanke for de små, og for alle os, der stadig er nysgerrige. Hver plakat trykkes først, når du bestiller den.</p>
    </section>
    <section class="grid">
      ${items.map((p, i) => `
        <button class="card reveal" style="animation-delay:${i * .04}s" onclick="go('product','${esc(p.id)}')">
          <div class="thumb">
            ${p.thumb ? `<img src="${esc(p.thumb)}" alt="${esc(p.name)}" loading="lazy">`
                      : `<span class="ph">Billede på vej</span>`}
          </div>
          <div class="body">
            <h3>${esc(p.name)}</h3>
            <div class="price"><small>fra</small> ${kr(p.min_price)}</div>
          </div>
        </button>`).join('')}
    </section>`;
}

function renderProduct(id) {
  const p = CATALOG[id];
  if (!p) { go('shop'); return; }
  let sel = 0;
  app.innerHTML = `
    <button class="back" onclick="go('shop')">← Tilbage til alle plakater</button>
    <section class="detail">
      <div class="imgcol reveal">
        ${p.thumb ? `<img id="mainImg" src="${esc(p.thumb)}" alt="${esc(p.name)}">`
                  : `<span class="ph">Billede på vej</span>`}
      </div>
      <div class="reveal">
        <h1>${esc(p.name)}</h1>
        <p class="desc">${esc(p.description)}</p>
        <div class="price-now" id="priceNow">${kr(p.min_price)}</div>
        <div class="sizes" id="sizes">
          ${p.variants.map((v, i) => `
            <button class="size-opt ${i === 0 ? 'active' : ''}" data-i="${i}">
              <span class="s-size">${esc(v.size)}</span>
              <span class="s-price">${kr(v.price)}</span>
            </button>`).join('')}
        </div>
        <button class="btn" id="addBtn">Læg i kurv</button>
        <div class="note-eco">
          <span class="leaf">🌱</span>
          <span>Dine plakater trykkes on demand på FSC/PEFC-certificeret papir — der ligger intet lager, og der trykkes kun det, du bestiller.</span>
        </div>
      </div>
    </section>`;

  const img = document.getElementById('mainImg');
  const price = document.getElementById('priceNow');
  app.querySelectorAll('.size-opt').forEach(btn => btn.addEventListener('click', () => {
    sel = +btn.dataset.i;
    app.querySelectorAll('.size-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    price.textContent = kr(p.variants[sel].price);
    if (img && p.variants[sel].image_url) img.src = p.variants[sel].image_url;
  }));
  document.getElementById('addBtn').addEventListener('click', () => addToCart(p.id, p.variants[sel].size));
}

function renderCart() {
  const cart = getCart(), keys = Object.keys(cart);
  app.innerHTML = `
    <div class="panel reveal">
      <h1>Din kurv</h1>
      ${keys.length === 0 ? `
        <div class="empty">
          <h2>Kurven er tom endnu</h2>
          <p style="margin-bottom:22px;">Tag et kig på plakaterne — måske er der en, der skal med hjem.</p>
          <button class="btn" onclick="go('shop')">Se plakaterne</button>
        </div>` : `
        ${keys.map(key => { const l = cart[key]; return `
          <div class="cart-row">
            ${l.image_url ? `<img class="ci-img" src="${esc(l.image_url)}" alt="${esc(l.name)}">`
                          : `<div class="ci-img"></div>`}
            <div class="ci-info">
              <h3>${esc(l.name)}</h3>
              <div class="ci-size">${esc(l.size)} · ${kr(l.price)} pr. stk.</div>
              <div class="qty">
                <input type="number" min="0" value="${l.qty}"
                       onchange="setQty('${esc(key)}', this.value)">
                <span style="color:var(--ink-soft);font-size:0.85rem;">stk.</span>
              </div>
            </div>
            <div style="text-align:right;">
              <div class="ci-price">${kr(l.price * l.qty)}</div>
              <button class="remove" onclick="removeLine('${esc(key)}')">Fjern</button>
            </div>
          </div>`; }).join('')}
        <div class="cart-total">
          <span class="lbl">I alt</span>
          <span class="amt">${kr(cartTotal())}</span>
        </div>
        <div style="margin-top:28px; display:flex; gap:12px; flex-wrap:wrap;">
          <button class="btn ghost" onclick="go('shop')">Fortsæt med at kigge</button>
          <button class="btn" onclick="go('checkout')">Til bestilling</button>
        </div>`}
    </div>`;
  updateBadge();
}

function renderCheckout() {
  const cart = getCart(), keys = Object.keys(cart);
  if (keys.length === 0) { renderCart(); return; }
  app.innerHTML = `
    <div class="panel reveal">
      <h1>Bestilling</h1>
      <p style="color:var(--ink-soft); margin-bottom:26px;">
        Skriv dit navn og din e-mail, så sender jeg dig en bekræftelse og vender tilbage med
        betaling og levering. Der er ingen online-betaling endnu — vi tager den sammen på mail.
      </p>
      <div id="formErrors"></div>
      <div class="layout-2">
        <div>
          <div class="field">
            <label for="name">Navn</label>
            <input type="text" id="name" required>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>
          </div>
          <div class="field">
            <label for="note">Besked til Sofie <span style="font-weight:400;color:var(--ink-soft);">(valgfrit)</span></label>
            <textarea id="note" placeholder="Et ønske, et spørgsmål, en hilsen…"></textarea>
          </div>
          <button class="btn full" onclick="checkout()">Send bestilling</button>
        </div>
        <div>
          <div class="panel" style="margin:0; box-shadow:none; border:1px solid var(--line);">
            <h3 style="font-family:'Fraunces',serif; font-size:1.2rem; margin-bottom:16px;">Din ordre</h3>
            ${keys.map(key => { const l = cart[key]; return `
              <div style="display:flex; justify-content:space-between; padding:8px 0; font-size:0.95rem;">
                <span>${esc(l.name)} <span style="color:var(--ink-soft);">(${esc(l.size)} × ${l.qty})</span></span>
                <span style="font-weight:700;">${kr(l.price * l.qty)}</span>
              </div>`; }).join('')}
            <div class="cart-total" style="margin-top:14px; padding-top:14px;">
              <span class="lbl" style="font-size:1.1rem;">I alt</span>
              <span class="amt" style="font-size:1.2rem;">${kr(cartTotal())}</span>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

/* ---------- Checkout ------------------------------------------------------
   Lige nu: samler ordren og åbner en færdigskrevet mail til Sofie.
   SENERE (Stripe): i stedet for mailto kalder du her et Stripe Payment Link
   eller Stripe Checkout. Kurvens linjer (getCart) er allerede struktureret,
   så de kan mappes direkte til Stripe line_items.
--------------------------------------------------------------------------- */
function checkout() {
  const name  = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const note  = document.getElementById('note').value.trim();
  const cart  = getCart(), keys = Object.keys(cart);

  const errors = [];
  if (!name) errors.push('Skriv venligst dit navn.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) errors.push('Tjek lige din e-mailadresse.');
  if (!keys.length) errors.push('Din kurv er tom.');

  const box = document.getElementById('formErrors');
  if (errors.length) {
    box.innerHTML = `<div class="errors"><ul>${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
    window.scrollTo(0, 0);
    return;
  }

  let body = 'Ny bestilling fra Småkunst\n----------------------------------\n\n';
  body += `Navn:   ${name}\nE-mail: ${email}\n\nBestilling:\n`;
  keys.forEach(key => { const l = cart[key];
    body += `  • ${l.name} — ${l.size} × ${l.qty} = ${kr(l.price * l.qty)}\n`; });
  body += `\nI alt: ${kr(cartTotal())}\n`;
  if (note) body += `\nBesked fra kunden:\n${note}\n`;
  body += '\n----------------------------------\nPlakaterne trykkes on demand på FSC/PEFC-certificeret papir.\n';

  const subject = 'Ny bestilling — ' + name;
  const mailto = `mailto:${CONFIG.ownerEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  localStorage.setItem('smaakunst_lastname', name);
  window.location.href = mailto;
  saveCart({});
  setTimeout(() => go('done'), 400);
}

function renderDone() {
  const name = localStorage.getItem('smaakunst_lastname') || '';
  app.innerHTML = `
    <div class="panel reveal">
      <div class="empty">
        <div style="font-size:3rem; margin-bottom:10px;">🧡</div>
        <h2>Tusind tak${name ? ', ' + esc(name) : ''}!</h2>
        <p style="margin-bottom:8px;">Din mail er klar i dit mailprogram — tryk send, så har jeg din bestilling.</p>
        <p style="margin-bottom:24px; color:var(--ink-soft);">Jeg vender tilbage til dig med betaling og levering så hurtigt, jeg kan. — Sofie</p>
        <button class="btn" onclick="go('shop')">Tilbage til shoppen</button>
      </div>
    </div>`;
  updateBadge();
}

function renderEmptyData() {
  app.innerHTML = `
    <div class="data-warn">
      <strong>Ingen plakater kunne hentes lige nu.</strong><br>
      Tjek at Google Sheets-API-nøglen er sat korrekt i CONFIG, og at arket er delt offentligt (læseadgang).
    </div>`;
}

/* ---------- Opstart ------------------------------------------------------- */
(async function init() {
  updateBadge();
  try {
    CATALOG = await loadCatalog();
  } catch (err) {
    console.error(err);
    renderEmptyData();
    return;
  }
  window.addEventListener('hashchange', router);
  router();
})();
</script>
</body>
</html>
